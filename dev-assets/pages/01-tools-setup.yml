page_type: settings
section: Tools & # Optional
title: Setup &
icon: applications-engineering-symbolic # Optional
groups:
  - title: Some settings & # Optional
    description: Set some settings
    link:
      title: More info &
      url: https://www.google.com
    settings:
      - type: input
        title: Input something &
        check: check it
        input_type: name

      - type: switch
        title: SystemD &
        subtitle: Enable some services & # Optional
        actions:
          - action: systemd
            type: enable
            scope: user
            unit: some-user.service
            now: true # Optional
            fail_allowed: true # Optional

          - action: systemd
            type: enable
            scope: system
            now: false
            unit: some-system.service
            fail_allowed: true

          - action: systemd
            type: disable
            scope: user
            unit: some-user.service
            fail_allowed: true

      - type: switch
        title: Rpm Ostree layer
        subtitle: Layer some packages
        actions:
          - action: rpmostree
            type: install
            fail_allowed: true
            packages:
              - some-package-install

          - action: rpmostree
            type: remove
            fail_allowed: true
            packages:
              - some-package-remove

      - type: switch
        title: Rpm Ostree kargs
        subtitle: Configure kargs
        actions:
          - action: rpmostree
            type: kargs
            add:
              - some=karg
            remove:
              - some=karg

          - action: rpmostree
            type: kargs
            add:
              - some=karg
          - action: rpmostree
            type: kargs
            remove:
              - some=karg

      - type: switch
        title: Add me to docker group
        subtitle: Add a user to the docker group
        actions:
          - action: usergroup
            type: add
            group: docker
            create_if_missing: true # Optional

      - type: switch
        title: Disable logout prompt
        subtitle: Set Gnome to not show a prompt on logout / restart / shutdown
        actions:
          - action: dconf
            type: set
            schema: org.gnome.SessionManager
            key: logout-prompt
            value: "false"

      - type: switch
        title: Enable wake-on-lan
        subtitle: Add udev rule to enable wol on all network devices
        actions:
          - action: symlink
            udev: 81-wol.rules

      - type: switch
        title: Enable stereo upmix
        subtitle: Basic pipewire config to enable stero upmixing to surround
        actions:
          - action: symlink
            pipewire: 40-upmix.conf

      - type: switch
        title: Enable some repo
        subtitle: Add mullvad rpm repo
        actions:
          - action: symlink
            rpmrepo: mullvad.repo
