page_type: settings
section: Tools & # Optional
title: Setup &
icon: applications-engineering-symbolic # Optional
groups:
  - title: Some settings & # Optional
    description: Set some settings
    link:
      title: More info &
      url: https://www.google.com
    settings:
      - type: input
        title: Input something &
        check: check it
        input_type: name

      - type: switch
        title: SystemD &
        subtitle: Enable some services & # Optional
        actions:
          - action: systemd
            type: enable
            scope: user
            unit: some-user.service
            now: true # Optional
            fail_allowed: true # Optional

          - action: systemd
            type: enable
            scope: system
            now: false
            unit: some-system.service
            fail_allowed: true

          - action: systemd
            type: disable
            scope: user
            unit: some-user.service
            fail_allowed: true

      - type: switch
        title: Rpm Ostree layer
        subtitle: Layer some packages
        actions:
          - action: rpmostree
            type: install
            fail_allowed: true
            packages:
              - some-package-install

          - action: rpmostree
            type: remove
            fail_allowed: true
            packages:
              - some-package-remove

      - type: switch
        title: Rpm Ostree kargs
        subtitle: Configure kargs
        actions:
          - action: rpmostree
            type: kargs
            add:
              - some=karg
            remove:
              - some=karg

          - action: rpmostree
            type: kargs
            add:
              - some=karg
          - action: rpmostree
            type: kargs
            remove:
              - some=karg

      - type: switch
        title: Add me to docker group
        subtitle: Add a user to the docker group
        actions:
          - action: usergroup
            type: add
            group: docker
            create_if_missing: true # Optional

      - type: switch
        title: Do some USB udev
        subtitle: Add udev rule
        actions:
          - action: udev
            type: add
            order: 70
            name: my-usb-device
            rule:
              - action:
                  operator: match
                  value: add
              - subsystem:
                  operator: match
                  value: usb
              - attr:
                  selector: idVendor
                  operator: match
                  value: "1234"
              - attr:
                  selector: idProduct
                  operator: match
                  value: "5678"
              - mode:
                  operator: assign
                  value: "0660"
              - tag:
                  operator: append
                  value: uaccess

      - type: switch
        title: Enable wake-on-lan
        subtitle: Add udev rule to enable wol on all network devices
        actions:
          - action: udev
            type: add
            order: 81
            name: wol
            rule:
              - action:
                  operator: match
                  value: add
              - subsystem:
                  operator: match
                  value: net
              - name:
                  operator: match
                  value: "en*"
              - run:
                  operator: append
                  value: "/usr/bin/ethtool -s $name wol g"

      - type: switch
        title: Disable logout prompt
        subtitle: Set Gnome to not show a prompt on logout / restart / shutdown
        actions:
          - action: dconf
            type: set
            schema: org.gnome.SessionManager
            key: logout-prompt
            value: "false"
