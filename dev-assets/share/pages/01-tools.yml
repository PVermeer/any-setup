page_type: settings
title: Tools
section: Tools
icon: applications-utilities-symbolic
groups:
  - title: Some settings
    settings:
      - type: input
        title: Input something
        check: check it
        input_type: name

      - type: switch
        title: SystemD
        subtitle: Enable some services
        actions:
          - action: systemd
            type: enable
            scope: user
            now: true
            unit: some-user.service
            fail_allowed: true

          - action: systemd
            type: enable
            scope: system
            now: false
            unit: some-system.service
            fail_allowed: true

          - action: systemd
            type: disable
            scope: user
            unit: some-user.service
            fail_allowed: true

      - type: switch
        title: Rpm Ostree layer
        subtitle: Layer some packages
        actions:
          - action: rpmostree
            type: install
            fail_allowed: true
            packages:
              - some-package

          - action: rpmostree
            type: remove
            fail_allowed: true
            packages:
              - some-package

      - type: switch
        title: Rpm Ostree kargs
        subtitle: Configure kargs
        actions:
          - action: rpmostree
            type: kargs
            add:
              - some=karg
            remove:
              - some=karg
